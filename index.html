<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGION ARCHIVE // 레기온 아지트 블로그</title>
  <style>
    :root {
      --bg-main: #0d1017;
      --bg-surface: #151a24;
      --bg-surface-hover: #1c2331;
      --bg-elevated: #222a3b;
      --border: #283246;
      --text-main: #e6edf7;
      --text-muted: #8e9bb0;
      --accent: #6c8cff;
      --accent-2: #9b6cff;
      --accent-soft: rgba(108, 140, 255, 0.14);
      --success: #34d399;
      --warning: #fbbf24;
      --pink: #f472b6;
      --danger: #f87171;
      --radius: 14px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(13, 16, 23, 0.86);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 6px 20px rgba(108, 140, 255, 0.25);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 540px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-surface-hover);
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.14);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.24);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12.5px;
      border-radius: 8px;
    }

    .btn-xs {
      padding: 4px 8px;
      font-size: 11.5px;
      border-radius: 7px;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    .hero-card {
      background: linear-gradient(135deg, var(--accent-soft), rgba(244, 114, 182, 0.06));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero-card h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .hero-card p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
    }

    .stat-pill strong {
      color: var(--accent);
      margin-left: 5px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.18s, border-color 0.18s, background 0.18s;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:hover {
      transform: translateY(-3px);
      border-color: #3b4a69;
      background: var(--bg-surface-hover);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tag.guide {
      background: rgba(52, 211, 153, 0.14);
      color: var(--success);
    }

    .tag.gallery {
      background: rgba(244, 114, 182, 0.14);
      color: var(--pink);
    }

    .tag.chat {
      background: rgba(251, 191, 36, 0.14);
      color: var(--warning);
    }

    .tag.recruit {
      background: rgba(155, 108, 255, 0.16);
      color: #b794ff;
    }

    .date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-thumb {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
    }

    .card-excerpt {
      font-size: 14px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      color: var(--text-muted);
      gap: 8px;
      flex-wrap: wrap;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg-elevated);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* 투표 옵션 */
    .poll-option {
      width: 100%;
      text-align: left;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
      transition: border-color 0.18s;
    }

    .poll-option:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .poll-option.voted {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .poll-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: var(--accent-soft);
      z-index: 0;
      transition: width 0.25s ease;
    }

    .poll-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      gap: 8px;
    }

    /* 파티 모집 직업 그리드 (투표형 버튼) */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .class-btn {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 8px;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      transition: all 0.15s;
    }

    .class-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .class-btn.has-member {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .class-btn.my-picked {
      box-shadow: inset 0 0 0 1px var(--success);
      border-color: var(--success);
    }

    .class-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-muted);
    }

    .class-btn.has-member .class-count {
      background: var(--accent);
      color: #fff;
    }

    .helper-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* 명단 확인 모달 내부 스타일 */
    .roster-box {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .roster-title {
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .roster-names {
      font-size: 13px;
      color: var(--text-muted);
    }

    .wiki-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .wiki-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .wiki-box h3 {
      font-size: 16px;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .wiki-box ul {
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .wiki-box li {
      margin-bottom: 6px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 13, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 640px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: var(--bg-elevated);
      border: none;
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
    }

    textarea.form-control {
      min-height: 110px;
      resize: vertical;
    }

    .color-swatches {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .swatch-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
    }

    .swatch-btn.active {
      border-color: var(--text-main);
      background: var(--bg-elevated);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-badge" id="brandBadge">L</div>
        <div>
          <div class="brand-title" id="brandTitle">LEGION ARCHIVE</div>
          <div class="brand-sub" id="brandSub">레기온 기록 · 공략 · 스샷 아지트</div>
        </div>
      </div>

      <div class="header-actions">
        <input
          id="searchInput"
          class="search-box"
          type="text"
          placeholder="제목, 내용, 작성자 검색..."
        />
        <button class="btn btn-ghost" id="syncBtn" title="시트 최신 데이터 불러오기">↻ 새로고침</button>
        <button class="btn btn-ghost" id="openSettingsBtn">⚙ 레기온 설정</button>
        <button class="btn btn-primary" id="openWriteBtn">+ 새 글</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-card">
      <div>
        <h1 id="heroTitle">오늘도 수고 많았어요, 레기온 여러분 🌙</h1>
        <p id="heroDesc">공략 정리부터 레이드 후기, 스샷 기록과 투표·모집까지 한곳에 모아두는 공간입니다.</p>
      </div>
      <div class="stats">
        <div class="stat-pill">누적 기록<strong id="totalCount">0</strong></div>
        <div class="stat-pill">진행 중 투표<strong id="pollCount">0</strong></div>
        <div class="stat-pill">파티 모집<strong id="recruitCount">0</strong></div>
      </div>
    </section>

    <nav class="tabs" id="tabBar">
      <button class="tab-btn active" data-tab="all">전체 피드</button>
      <button class="tab-btn" data-tab="recruit">투표 / 모집</button>
      <button class="tab-btn" data-tab="guide">공략 & 가이드</button>
      <button class="tab-btn" data-tab="gallery">스샷 갤러리</button>
      <button class="tab-btn" data-tab="chat">잡담 & 일지</button>
      <button class="tab-btn" data-tab="wiki">레기온 위키</button>
    </nav>

    <section id="contentArea"></section>
  </main>

  <!-- 글 읽기 모달 -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-head">
        <span class="tag" id="detailTag">공략</span>
        <button class="close-btn" id="closeDetailBtn">✕</button>
      </div>
      <h2 id="detailTitle" style="font-size:22px; margin-bottom:8px;"></h2>
      <div id="detailMeta" style="font-size:13px; color:var(--text-muted); margin-bottom:16px;"></div>
      <img id="detailImg" class="card-thumb" style="height:240px; margin-bottom:16px; display:none;" alt="" />
      <div id="detailBody" style="white-space:pre-line; font-size:15px; color:var(--text-main);"></div>
    </div>
  </div>

  <!-- 투표자 / 신청자 명단 확인 모달 -->
  <div class="modal-backdrop" id="rosterModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="rosterModalTitle" style="font-size:18px;">명단 확인</h2>
        <button class="close-btn" id="closeRosterBtn">✕</button>
      </div>
      <div id="rosterModalBody"></div>
    </div>
  </div>

  <!-- 새 글 작성 모달 -->
  <div class="modal-backdrop" id="writeModal">
    <div class="modal">
      <div class="modal-head">
        <h2 style="font-size:18px;">새 기록 남기기</h2>
        <button class="close-btn" id="closeWriteBtn">✕</button>
      </div>
      <form id="writeForm">
        <div class="form-group">
          <label for="postCategory">탭 / 카테고리</label>
          <select id="postCategory" class="form-control">
            <option value="guide">공략 & 가이드</option>
            <option value="gallery">스샷 갤러리</option>
            <option value="chat">잡담 & 일지</option>
          </select>
        </div>
        <div class="form-group">
          <label for="postAuthor">닉네임</label>
          <input id="postAuthor" class="form-control" type="text" placeholder="예: 서리빛" required />
        </div>
        <div class="form-group">
          <label for="postTitle">제목</label>
          <input id="postTitle" class="form-control" type="text" placeholder="제목을 입력하세요" required />
        </div>
        <div class="form-group">
          <label for="postImage">이미지 URL (스샷 갤러리용, 선택)</label>
          <input id="postImage" class="form-control" type="url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="postContent">내용</label>
          <textarea id="postContent" class="form-control" placeholder="공략 팁, 오늘 있었던 일, 소감 등을 자유롭게 적어주세요." required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn btn-ghost" id="cancelWriteBtn">취소</button>
          <button type="submit" class="btn btn-primary" id="submitWriteBtn">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 새 투표 생성 모달 -->
  <div class="modal-backdrop" id="pollModal">
    <div class="modal">
      <div class="modal-head">
        <h2 style="font-size:18px;">새 투표 만들기</h2>
        <button class="close-btn" id="closePollBtn">✕</button>
      </div>
      <form id="pollForm">
        <div class="form-group">
          <label for="pollQuestion">투표 주제</label>
          <input id="pollQuestion" class="form-control" type="text" placeholder="예: 이번 주 정규 레이드 시간 언제 좋을까요?" required />
        </div>
        <div class="form-group">
          <label for="pollAuthor">작성자</label>
          <input id="pollAuthor" class="form-control" type="text" placeholder="예: 하늘정원" required />
        </div>
        <div class="form-group">
          <label for="pollOptions">선택지 (줄바꿈으로 구분, 2개 이상)</label>
          <textarea id="pollOptions" class="form-control" placeholder="수요일 21:00&#10;목요일 21:30&#10;토요일 20:00" required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn btn-ghost" id="cancelPollBtn">취소</button>
          <button type="submit" class="btn btn-primary" id="submitPollBtn">투표 등록</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모집 생성 및 수정 모달 -->
  <div class="modal-backdrop" id="recruitModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="recruitModalTitle" style="font-size:18px;">새 파티 / 멤버 모집</h2>
        <button class="close-btn" id="closeRecruitBtn">✕</button>
      </div>
      <form id="recruitForm">
        <input type="hidden" id="recruitEditId" value="" />
        <div class="form-group">
          <label for="recruitTitle">모집 제목</label>
          <input id="recruitTitle" class="form-control" type="text" placeholder="예: 금요일 22:00 주간 던전 4인 모집" required />
        </div>
        <div class="form-group">
          <label for="recruitHost">모집장 닉네임</label>
          <input id="recruitHost" class="form-control" type="text" placeholder="예: 노을빛" required />
        </div>
        <div class="form-group">
          <label for="recruitMax">모집 정원 (본인 포함)</label>
          <input id="recruitMax" class="form-control" type="number" min="2" max="24" value="4" required />
        </div>
        <div class="form-group">
          <label for="recruitNote">안내 / 역할 / 조건</label>
          <textarea id="recruitNote" class="form-control" placeholder="초행 환영, 디코 청취 가능하신 분, 출발 시간 등" required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn btn-ghost" id="cancelRecruitBtn">취소</button>
          <button type="submit" class="btn btn-primary" id="submitRecruitBtn">모집 올리기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 레기온 개성 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <div class="modal-head">
        <h2 style="font-size:18px;">⚙ 레기온 개성 커스텀</h2>
        <button class="close-btn" id="closeSettingsBtn">✕</button>
      </div>
      <form id="settingsForm">
        <div class="form-group">
          <label for="cfgBadge">로고 이니셜 / 엠블럼 (1~2글자)</label>
          <input id="cfgBadge" class="form-control" type="text" maxlength="2" required />
        </div>
        <div class="form-group">
          <label for="cfgName">레기온 이름</label>
          <input id="cfgName" class="form-control" type="text" required />
        </div>
        <div class="form-group">
          <label for="cfgSub">헤더 부제</label>
          <input id="cfgSub" class="form-control" type="text" required />
        </div>
        <div class="form-group">
          <label for="cfgHeroTitle">메인 환영 문구</label>
          <input id="cfgHeroTitle" class="form-control" type="text" required />
        </div>
        <div class="form-group">
          <label for="cfgHeroDesc">메인 소개 문구</label>
          <input id="cfgHeroDesc" class="form-control" type="text" required />
        </div>
        <div class="form-group">
          <label>포인트 컬러 테마</label>
          <div class="color-swatches" id="swatchGroup">

              <span class="dot" style="background:#6c8cff;"></span>문라이트 블루
            </button>
            <button type="button" class="swatch-btn" data-theme="violet">
              <span class="dot" style="background:#a78bfa;"></span>네뷸라 바이올렛
            </button>
            <button type="button" class="swatch-btn" data-theme="emerald">
              <span class="dot" style="background:#34d399;"></span>포레스트 에메랄드
            </button>
            <button type="button" class="swatch-btn" data-theme="rose">
              <span class="dot" style="background:#fb7185;"></span>크림슨 로즈
            </button>
          </div>
        </div>
        <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn btn-ghost" id="resetSettingsBtn">기본값 복원</button>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn btn-ghost" id="cancelSettingsBtn">취소</button>
            <button type="submit" class="btn btn-primary">저장하기</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0-C_eKbB-n1AqpOGfwHIhYIU_sek8VWmXCi4JHvV4OEC5xvrKsqTXKTY4YGI_ig8ZKw/exec";

    const RECRUIT_CLASSES = [
      "수호성", "검성", "궁성",
      "살성", "권성", "정령성",
      "마도성", "호법성", "치유성"
    ];

    const KEYS = {
      posts: "legion_archive_posts_v2",
      polls: "legion_archive_polls_v2",
      recruits: "legion_archive_recruits_v2",
      config: "legion_archive_config_v1",
      myNickname: "legion_archive_my_nickname_v1"
    };

    const defaultConfig = {
      badge: "L",
      name: "LEGION ARCHIVE",
      sub: "레기온 기록 · 공략 · 스샷 아지트",
      heroTitle: "오늘도 수고 많았어요, 레기온 여러분 🌙",
      heroDesc: "공략 정리부터 레이드 후기, 스샷 기록과 투표·모집까지 한곳에 모아두는 공간입니다.",
      theme: "blue"
    };

    const themes = {
      blue: { accent: "#6c8cff", accent2: "#9b6cff", accentSoft: "rgba(108, 140, 255, 0.14)" },
      violet: { accent: "#a78bfa", accent2: "#ec4899", accentSoft: "rgba(167, 139, 250, 0.15)" },
      emerald: { accent: "#34d399", accent2: "#2dd4bf", accentSoft: "rgba(52, 211, 153, 0.14)" },
      rose: { accent: "#fb7185", accent2: "#f59e0b", accentSoft: "rgba(251, 113, 133, 0.15)" }
    };

    function createEmptySlots() {
      const obj = {};
      RECRUIT_CLASSES.forEach(c => { obj[c] = []; });
      return obj;
    }

    function normalizeSlots(rawSlots, legacyMembers) {
      const slots = createEmptySlots();
      if (rawSlots && typeof rawSlots === "object") {
        RECRUIT_CLASSES.forEach(c => {
          if (Array.isArray(rawSlots[c])) {
            slots[c] = rawSlots[c].filter(Boolean);
          }
        });
      } else if (Array.isArray(legacyMembers) && legacyMembers.length > 0) {
        slots["수호성"] = legacyMembers.filter(Boolean);
      }
      return slots;
    }

    function normalizePoll(poll) {
      const options = (Array.isArray(poll.options) ? poll.options : []).map(o => {
        const voters = Array.isArray(o.voters)
          ? o.voters.filter(Boolean)
          : (Number(o.votes) > 0 ? Array.from({ length: Number(o.votes) }, (_, i) => `익명${i + 1}`) : []);
        return {
          id: o.id,
          text: o.text,
          voters,
          votes: voters.length
        };
      });
      return {
        ...poll,
        id: Number(poll.id),
        options
      };
    }

    const initialPosts = [
      {
        id: 1,
        category: "guide",
        title: "주간 레이드 핵심 패턴 요약 & 준비물 체크리스트",
        author: "하늘정원",
        date: "2026-11-18",
        image: "",
        content: "1페이즈 광역기 타이밍에는 중앙 집결 후 외곽 분산이 핵심입니다.\n\n- 필수 소모품: 회복 물약, 보호 주문서\n- 출발 10분 전 음성/파티 채널 대기\n- 초행 분들도 편하게 질문 남겨주세요!"
      },
      {
        id: 2,
        category: "gallery",
        title: "첫 클리어 기념 레기온 단체 스샷 📸",
        author: "노을빛",
        date: "2026-11-19",
        image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=900&q=80",
        content: "트라이 끝에 드디어 첫 클리어! 다들 늦은 시간까지 고생 많으셨고 다음 주엔 더 깔끔하게 정리해봐요."
      },
      {
        id: 3,
        category: "chat",
        title: "오늘 저녁 일퀘 같이 도실 분 계신가요?",
        author: "달토끼",
        date: "2026-11-20",
        image: "",
        content: "9시 반쯤 접속해서 일퀘랑 재료 파밍 가볍게 돌 생각입니다. 편하게 댓글이나 귓말 주세요~"
      }
    ];

    const initialPolls = [
      {
        id: 101,
        question: "이번 주 정규 콘텐츠 진행 요일 투표",
        author: "하늘정원",
        date: "2026-11-20",
        options: [
          { id: "a", text: "수요일 21:00", voters: [], votes: 0 },
          { id: "b", text: "목요일 21:30", voters: [], votes: 0 },
          { id: "c", text: "토요일 20:00", voters: [], votes: 0 }
        ]
      }
    ];

    const initialRecruits = [
      {
        id: 201,
        title: "오늘 22:00 주간 던전 4인 파티 모집",
        host: "노을빛",
        max: 4,
        slots: { ...createEmptySlots(), 수호성: ["노을빛"] },
        note: "초행/숙련 모두 환영! 원하는 직업 버튼을 눌러 신청하거나 본인 신청 버튼을 다시 눌러 취소하세요."
      }
    ];

    const categoryMeta = {
      guide: { label: "공략 & 가이드", cls: "guide" },
      gallery: { label: "스샷 갤러리", cls: "gallery" },
      chat: { label: "잡담 & 일지", cls: "chat" }
    };

    let config = loadLocal(KEYS.config, defaultConfig);
    let posts = loadLocal(KEYS.posts, initialPosts);
    let polls = loadLocal(KEYS.polls, initialPolls).map(normalizePoll);
    let recruits = loadLocal(KEYS.recruits, initialRecruits).map(r => ({
      ...r,
      id: Number(r.id),
      max: Number(r.max) || 4,
      slots: normalizeSlots(r.slots, r.members)
    }));
    let myNickname = loadLocal(KEYS.myNickname, "");
    let currentTab = "all";
    let searchQuery = "";
    let selectedTheme = config.theme || "blue";

    function loadLocal(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw !== null) return JSON.parse(raw);
      } catch (e) {}
      return structuredClone(fallback);
    }

    function saveLocal(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    function promptNickname(defaultValue = "") {
      const input = prompt("투표/파티 신청에 사용할 닉네임을 입력하세요 (1인 1표 적용):", defaultValue || myNickname || "");
      if (input === null) return "";
      const clean = input.trim();
      if (!clean) {
        alert("닉네임을 입력해야 참여할 수 있습니다.");
        return "";
      }
      myNickname = clean;
      saveLocal(KEYS.myNickname, myNickname);
      return clean;
    }

    function getTotalRecruitApplicants(rec) {
      return RECRUIT_CLASSES.reduce((sum, c) => sum + (rec.slots[c]?.length || 0), 0);
    }

    function getUserPickedClass(rec, nick) {
      if (!nick) return null;
      return RECRUIT_CLASSES.find(c => (rec.slots[c] || []).includes(nick)) || null;
    }

    function getUserVotedOption(poll, nick) {
      if (!nick) return null;
      return poll.options.find(o => (o.voters || []).includes(nick)) || null;
    }

    async function apiGetAll() {
      if (!SCRIPT_URL) return null;
      const res = await fetch(SCRIPT_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("GET 실패");
      return await res.json();
    }

    async function apiPost(body) {
      if (!SCRIPT_URL) return;
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      });
    }

    async function syncFromSheet() {
      const syncBtn = document.getElementById("syncBtn");
      if (syncBtn) syncBtn.disabled = true;
      try {
        const remote = await apiGetAll();
        if (!remote) return;

        if (Array.isArray(remote.posts)) {
          posts = remote.posts;
          saveLocal(KEYS.posts, posts);
        }
        if (Array.isArray(remote.polls)) {
          polls = remote.polls.map(normalizePoll);
          saveLocal(KEYS.polls, polls);
        }
        if (Array.isArray(remote.recruits)) {
          recruits = remote.recruits.map(r => ({
            ...r,
            id: Number(r.id),
            max: Number(r.max) || 4,
            slots: normalizeSlots(r.slots, r.members)
          }));
          saveLocal(KEYS.recruits, recruits);
        }
        render();
      } catch (e) {
        console.error("시트 동기화 오류:", e);
      } finally {
        if (syncBtn) syncBtn.disabled = false;
      }
    }

    function applyConfig() {
      const t = themes[config.theme] || themes.blue;
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--accent-2", t.accent2);
      document.documentElement.style.setProperty("--accent-soft", t.accentSoft);
      document.title = `${config.name} // 레기온 아지트 블로그`;
      document.getElementById("brandBadge").textContent = (config.badge || "L").toUpperCase();
      document.getElementById("brandTitle").textContent = config.name;
      document.getElementById("brandSub").textContent = config.sub;
      document.getElementById("heroTitle").textContent = config.heroTitle;
      document.getElementById("heroDesc").textContent = config.heroDesc;
    }

    function updateStats() {
      document.getElementById("totalCount").textContent = posts.length;
      document.getElementById("pollCount").textContent = polls.length;
      document.getElementById("recruitCount").textContent = recruits.length;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isSafeImageUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch (e) {
        return false;
      }
    }

    function getFilteredPosts() {
      const q = searchQuery.trim().toLowerCase();
      return posts
        .filter(p => {
          const tabMatch = currentTab === "all" || currentTab === p.category;
          const searchMatch =
            !q ||
            String(p.title || "").toLowerCase().includes(q) ||
            String(p.content || "").toLowerCase().includes(q) ||
            String(p.author || "").toLowerCase().includes(q);
          return tabMatch && searchMatch;
        })
        .slice()
        .reverse();
    }

    function renderPollsSection() {
      if (!polls.length) {
        return `<div class="empty">진행 중인 투표가 없어요. 새 투표를 만들어보세요!</div>`;
      }
      return `
        <div class="grid">
          ${polls
            .slice()
            .reverse()
            .map(poll => {
              const totalVotes = poll.options.reduce((acc, o) => acc + (o.voters?.length || 0), 0);
              const myChoice = getUserVotedOption(poll, myNickname);
              return `
                <article class="card">
                  <div>
                    <div class="card-top" style="margin-bottom:10px;">
                      <span class="tag recruit">투표 (1인 1표)</span>
                      <span class="date">${escapeHtml(poll.date)} · ${escapeHtml(poll.author)}</span>
                    </div>
                    <h3 class="card-title" style="margin-bottom:12px;">${escapeHtml(poll.question)}</h3>
                    <div>
                      ${poll.options
                        .map(opt => {
                          const count = opt.voters?.length || 0;
                          const pct = totalVotes ? Math.round((count / totalVotes) * 100) : 0;
                          const isMyPick = myChoice?.id === opt.id;
                          return `
                            <button
                              type="button"
                              class="poll-option ${isMyPick ? "voted" : ""}"
                              data-poll-id="${poll.id}"
                              data-opt-id="${escapeHtml(opt.id)}"
                            >
                              <span class="poll-bar" style="width:${pct}%;"></span>
                              <span class="poll-row">
                                <span>${isMyPick ? "✓ " : ""}${escapeHtml(opt.text)}</span>
                                <span><strong>${count}표</strong> (${pct}%)</span>
                              </span>
                            </button>
                          `;
                        })
                        .join("")}
                    </div>
                    <div class="helper-hint">
                      ${myChoice ? `내 투표: <strong>${escapeHtml(myChoice.text)}</strong> (다른 항목 클릭 시 변경)` : "항목을 클릭해 닉네임으로 투표하세요."}
                    </div>
                  </div>
                  <div class="card-footer">
                    <span>총 ${totalVotes}표 참여</span>
                    <button type="button" class="btn btn-ghost btn-xs view-poll-voters-btn" data-poll-id="${poll.id}">
                      투표자 보기
                    </button>
                  </div>
                </article>
              `;
            })
            .join("")}
        </div>
      `;
    }

    function renderRecruitsSection() {
      if (!recruits.length) {
        return `<div class="empty">열린 파티 모집이 없어요. 새 모집을 올려보세요!</div>`;
      }
      return `
        <div class="grid">
          ${recruits
            .slice()
            .reverse()
            .map(item => {
              const totalCount = getTotalRecruitApplicants(item);
              const isFull = totalCount >= item.max;
              const myClass = getUserPickedClass(item, myNickname);
              return `
                <article class="card">
                  <div>
                    <div class="card-top" style="margin-bottom:10px;">
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span class="tag ${isFull ? "chat" : "guide"}">${isFull ? "모집 마감" : "모집 중"}</span>
                        <span class="date">${totalCount} / ${item.max}명</span>
                      </div>
                      <div class="card-actions">
                        <button type="button" class="btn btn-ghost btn-xs edit-recruit-btn" data-recruit-id="${item.id}">수정</button>
                        <button type="button" class="btn btn-danger btn-xs delete-recruit-btn" data-recruit-id="${item.id}">삭제</button>
                      </div>
                    </div>
                    <h3 class="card-title" style="margin-bottom:6px;">${escapeHtml(item.title)}</h3>
                    <p class="card-excerpt" style="-webkit-line-clamp:3;">${escapeHtml(item.note)}</p>

                    <div class="class-grid">
                      ${RECRUIT_CLASSES.map(cls => {
                        const list = item.slots[cls] || [];
                        const count = list.length;
                        const isMine = myClass === cls;
                        const disabledByFull = isFull && !isMine;
                        return `
                          <button
                            type="button"
                            class="class-btn ${count > 0 ? "has-member" : ""} ${isMine ? "my-picked" : ""}"
                            data-recruit-id="${item.id}"
                            data-class="${escapeHtml(cls)}"
                            ${disabledByFull ? "disabled" : ""}
                            title="${isMine ? "클릭하여 신청 취소" : `${cls} 신청하기`}"
                          >
                            <span>${isMine ? "✓ " : ""}${escapeHtml(cls)}</span>
                            <span class="class-count">${count}</span>
                          </button>
                        `;
                      }).join("")}
                    </div>
                    <div class="helper-hint">
                      ${myClass ? `내 신청 직업: <strong>${escapeHtml(myClass)}</strong> (같은 버튼 클릭 시 취소)` : "직업 버튼을 눌러 신청하세요."}
                    </div>
                  </div>

                  <div class="card-footer">
                    <span>모집장: ${escapeHtml(item.host)}</span>
                    <button type="button" class="btn btn-ghost btn-xs view-recruit-roster-btn" data-recruit-id="${item.id}">
                      신청자 보기
                    </button>
                  </div>
                </article>
              `;
            })
            .join("")}
        </div>
      `;
    }

    function openPollVotersModal(poll) {
      document.getElementById("rosterModalTitle").textContent = `투표자 명단 · ${poll.question}`;
      const bodyEl = document.getElementById("rosterModalBody");
      bodyEl.innerHTML = poll.options
        .map(opt => {
          const voters = opt.voters || [];
          return `
            <div class="roster-box">
              <div class="roster-title">
                <span>${escapeHtml(opt.text)}</span>
                <span style="color:var(--accent);">${voters.length}명</span>
              </div>
              <div class="roster-names">
                ${voters.length ? voters.map(v => escapeHtml(v)).join(", ") : "아직 투표한 사람이 없습니다."}
              </div>
            </div>
          `;
        })
        .join("");
      document.getElementById("rosterModal").classList.add("open");
    }

    function openRecruitRosterModal(rec) {
      const totalCount = getTotalRecruitApplicants(rec);
      document.getElementById("rosterModalTitle").textContent = `파티 신청자 명단 (${totalCount}/${rec.max}명) · ${rec.title}`;
      const bodyEl = document.getElementById("rosterModalBody");
      bodyEl.innerHTML = RECRUIT_CLASSES.map(cls => {
        const list = rec.slots[cls] || [];
        return `
          <div class="roster-box">
            <div class="roster-title">
              <span>${escapeHtml(cls)}</span>
              <span style="color:${list.length ? "var(--accent)" : "var(--text-muted)"};">${list.length}명</span>
            </div>
            <div class="roster-names">
              ${list.length ? list.map(n => escapeHtml(n)).join(", ") : "-"}
            </div>
          </div>
        `;
      }).join("");
      document.getElementById("rosterModal").classList.add("open");
    }

    function renderWiki() {
      return `
        <div class="wiki-list">
          <div class="wiki-box">
            <h3>📌 레기온 기본 규칙</h3>
            <ul>
              <li>서로 존중하고 배려하는 매너 플레이 지향</li>
              <li>분쟁 유발, 과도한 스포일러 주의</li>
              <li>공지 및 정기 일정은 투표·모집 탭에서 확인</li>
            </ul>
          </div>
          <div class="wiki-box">
            <h3>🧭 신규 멤버 가이드</h3>
            <ul>
              <li>상단 '⚙ 레기온 설정'으로 우리 레기온 이름·색상 꾸미기</li>
              <li>공략 탭에 팁 정리, 스샷 탭에 추억 남기기</li>
              <li>파티 모집 탭에서 원하는 직업 버튼을 눌러 신청</li>
            </ul>
          </div>
          <div class="wiki-box">
            <h3>🗓️ 정기 모임 안내</h3>
            <ul>
              <li>정규 일정은 주간 투표 결과에 따라 확정</li>
              <li>번개 파티는 모집 탭에서 선착순 참여</li>
            </ul>
          </div>
        </div>
      `;
    }

    function renderPostsGrid(list) {
      if (!list.length) {
        return `<div class="empty">조건에 맞는 글이 아직 없어요. 새 글을 남겨보세요!</div>`;
      }
      return `
        <div class="grid">
          ${list
            .map(post => {
              const meta = categoryMeta[post.category] || { label: "기록", cls: "" };
              const safeImg = isSafeImageUrl(post.image) ? post.image : "";
              return `
                <article class="card clickable" data-id="${post.id}">
                  <div>
                    <div class="card-top" style="margin-bottom:10px;">
                      <span class="tag ${meta.cls}">${meta.label}</span>
                      <span class="date">${escapeHtml(post.date)}</span>
                    </div>
                    ${safeImg ? `<img class="card-thumb" src="${escapeHtml(safeImg)}" alt="${escapeHtml(post.title)}" style="margin-bottom:12px;" />` : ""}
                    <h3 class="card-title" style="margin-bottom:6px;">${escapeHtml(post.title)}</h3>
                    <p class="card-excerpt">${escapeHtml(post.content)}</p>
                  </div>
                  <div class="card-footer">
                    <div class="author">
                      <span class="avatar">${escapeHtml((post.author || "?").slice(0, 1))}</span>
                      <span>${escapeHtml(post.author)}</span>
                    </div>
                    <span>읽기 →</span>
                  </div>
                </article>
              `;
            })
            .join("")}
        </div>
      `;
    }

    function render() {
      updateStats();
      const area = document.getElementById("contentArea");

      if (currentTab === "wiki") {
        area.innerHTML = renderWiki();
        return;
      }

      if (currentTab === "recruit") {
        area.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">🗳️ 레기온 투표</h2>
            <button type="button" class="btn btn-primary btn-sm" id="openPollBtn">+ 새 투표</button>
          </div>
          <div style="margin-bottom:32px;">${renderPollsSection()}</div>
          <div class="section-header">
            <h2 class="section-title">⚔️ 파티 / 멤버 모집</h2>
            <button type="button" class="btn btn-primary btn-sm" id="openRecruitBtn">+ 새 모집</button>
          </div>
          ${renderRecruitsSection()}
        `;
        bindDynamicActions();
        return;
      }

      const filtered = getFilteredPosts();
      area.innerHTML = renderPostsGrid(filtered);
      bindDynamicActions();
    }

    function openRecruitCreateModal() {
      document.getElementById("recruitEditId").value = "";
      document.getElementById("recruitModalTitle").textContent = "새 파티 / 멤버 모집";
      document.getElementById("submitRecruitBtn").textContent = "모집 올리기";
      document.getElementById("recruitForm").reset();
      document.getElementById("recruitMax").value = 4;
      document.getElementById("recruitModal").classList.add("open");
    }

    function openRecruitEditModal(rec) {
      document.getElementById("recruitEditId").value = rec.id;
      document.getElementById("recruitModalTitle").textContent = "모집글 수정하기";
      document.getElementById("submitRecruitBtn").textContent = "수정 저장";
      document.getElementById("recruitTitle").value = rec.title;
      document.getElementById("recruitHost").value = rec.host;
      document.getElementById("recruitMax").value = rec.max;
      document.getElementById("recruitNote").value = rec.note;
      document.getElementById("recruitModal").classList.add("open");
    }

    function bindDynamicActions() {
      document.querySelectorAll("article.card.clickable").forEach(card => {
        card.addEventListener("click", () => {
          const post = posts.find(p => Number(p.id) === Number(card.dataset.id));
          if (!post) return;
          const meta = categoryMeta[post.category] || { label: "기록", cls: "" };
          document.getElementById("detailTag").textContent = meta.label;
          document.getElementById("detailTag").className = `tag ${meta.cls}`;
          document.getElementById("detailTitle").textContent = post.title;
          document.getElementById("detailMeta").textContent = `${post.author} · ${post.date}`;
          const imgEl = document.getElementById("detailImg");
          if (isSafeImageUrl(post.image)) {
            imgEl.src = post.image;
            imgEl.style.display = "block";
          } else {
            imgEl.src = "";
            imgEl.style.display = "none";
          }
          document.getElementById("detailBody").textContent = post.content;
          document.getElementById("detailModal").classList.add("open");
        });
      });

      const openPollBtn = document.getElementById("openPollBtn");
      if (openPollBtn) openPollBtn.onclick = () => document.getElementById("pollModal").classList.add("open");

      const openRecruitBtn = document.getElementById("openRecruitBtn");
      if (openRecruitBtn) openRecruitBtn.onclick = openRecruitCreateModal;

      document.querySelectorAll(".poll-option").forEach(btn => {
        btn.addEventListener("click", async () => {
          const pollId = Number(btn.dataset.pollId);
          const optId = btn.dataset.optId;
          const poll = polls.find(p => Number(p.id) === pollId);
          const targetOpt = poll?.options.find(o => o.id === optId);
          if (!poll || !targetOpt) return;

          const voter = promptNickname(myNickname);
          if (!voter) return;

          if ((targetOpt.voters || []).includes(voter)) {
            alert("이미 해당 선택지에 투표하셨습니다.");
            return;
          }

          poll.options.forEach(o => {
            o.voters = (o.voters || []).filter(v => v !== voter);
          });
          targetOpt.voters.push(voter);
          poll.options.forEach(o => { o.votes = o.voters.length; });

          saveLocal(KEYS.polls, polls);
          render();

          await apiPost({ action: "castVote", pollId, optionId: optId, voter });
          setTimeout(syncFromSheet, 900);
        });
      });

      document.querySelectorAll(".view-poll-voters-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const pollId = Number(btn.dataset.pollId);
          const poll = polls.find(p => Number(p.id) === pollId);
          if (poll) openPollVotersModal(poll);
        });
      });

      document.querySelectorAll(".class-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const recId = Number(btn.dataset.recruitId);
          const className = btn.dataset.class;
          const rec = recruits.find(r => Number(r.id) === recId);
          if (!rec || !className) return;

          const voter = promptNickname(myNickname);
          if (!voter) return;

          const list = rec.slots[className] || [];
          const totalCount = getTotalRecruitApplicants(rec);
          const alreadyInClass = list.includes(voter);

          if (alreadyInClass) {
            const ok = confirm(`'${className}'에서 '${voter}' 님의 신청을 취소할까요?`);
            if (!ok) return;
            rec.slots[className] = list.filter(n => n !== voter);
          } else {
            if (totalCount >= rec.max) {
              alert("모집 정원이 가득 찼습니다.");
              return;
            }
            const prevClass = getUserPickedClass(rec, voter);
            if (prevClass && prevClass !== className) {
              rec.slots[prevClass] = (rec.slots[prevClass] || []).filter(n => n !== voter);
            }
            rec.slots[className] = [...list, voter];
          }

          saveLocal(KEYS.recruits, recruits);
          render();

          await apiPost({ action: "toggleRecruitClass", recruitId: recId, className, nickname: voter });
          setTimeout(syncFromSheet, 900);
        });
      });

      document.querySelectorAll(".view-recruit-roster-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const recId = Number(btn.dataset.recruitId);
          const rec = recruits.find(r => Number(r.id) === recId);
          if (rec) openRecruitRosterModal(rec);
        });
      });

      document.querySelectorAll(".edit-recruit-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const recId = Number(btn.dataset.recruitId);
          const rec = recruits.find(r => Number(r.id) === recId);
          if (rec) openRecruitEditModal(rec);
        });
      });

      document.querySelectorAll(".delete-recruit-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const recId = Number(btn.dataset.recruitId);
          const rec = recruits.find(r => Number(r.id) === recId);
          if (!rec) return;

          const ok = confirm(`'${rec.title}' 모집글을 삭제할까요?`);
          if (!ok) return;

          recruits = recruits.filter(r => Number(r.id) !== recId);
          saveLocal(KEYS.recruits, recruits);
          render();

          await apiPost({ action: "deleteRecruit", recruitId: recId });
          setTimeout(syncFromSheet, 900);
        });
      });
    }

    document.getElementById("tabBar").addEventListener("click", e => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById("syncBtn").addEventListener("click", syncFromSheet);

    const toggleModal = (id, open) => document.getElementById(id).classList.toggle("open", open);
    document.getElementById("openWriteBtn").onclick = () => toggleModal("writeModal", true);
    document.getElementById("closeWriteBtn").onclick = () => toggleModal("writeModal", false);
    document.getElementById("cancelWriteBtn").onclick = () => toggleModal("writeModal", false);
    document.getElementById("closeDetailBtn").onclick = () => toggleModal("detailModal", false);
    document.getElementById("closeRosterBtn").onclick = () => toggleModal("rosterModal", false);
    document.getElementById("closePollBtn").onclick = () => toggleModal("pollModal", false);
    document.getElementById("cancelPollBtn").onclick = () => toggleModal("pollModal", false);
    document.getElementById("closeRecruitBtn").onclick = () => toggleModal("recruitModal", false);
    document.getElementById("cancelRecruitBtn").onclick = () => toggleModal("recruitModal", false);

    document.getElementById("writeForm").addEventListener("submit", async e => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitWriteBtn");
      submitBtn.disabled = true;
      try {
        const newPost = {
          id: Date.now(),
          category: document.getElementById("postCategory").value,
          author: document.getElementById("postAuthor").value.trim(),
          title: document.getElementById("postTitle").value.trim(),
          image: document.getElementById("postImage").value.trim(),
          content: document.getElementById("postContent").value.trim(),
          date: new Date().toISOString().slice(0, 10)
        };
        posts.push(newPost);
        saveLocal(KEYS.posts, posts);
        e.target.reset();
        toggleModal("writeModal", false);
        render();

        await apiPost({ action: "addPost", post: newPost });
        setTimeout(syncFromSheet, 900);
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("pollForm").addEventListener("submit", async e => {
      e.preventDefault();
      const lines = document
        .getElementById("pollOptions")
        .value.split("\n")
        .map(s => s.trim())
        .filter(Boolean);
      if (lines.length < 2) {
        alert("선택지를 2개 이상 입력해 주세요.");
        return;
      }
      const submitBtn = document.getElementById("submitPollBtn");
      submitBtn.disabled = true;
      try {
        const newPoll = {
          id: Date.now(),
          question: document.getElementById("pollQuestion").value.trim(),
          author: document.getElementById("pollAuthor").value.trim(),
          date: new Date().toISOString().slice(0, 10),
          options: lines.map((text, idx) => ({ id: `opt_${idx}_${Date.now()}`, text, voters: [], votes: 0 }))
        };
        polls.push(newPoll);
        saveLocal(KEYS.polls, polls);
        e.target.reset();
        toggleModal("pollModal", false);
        render();

        await apiPost({ action: "addPoll", poll: newPoll });
        setTimeout(syncFromSheet, 900);
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("recruitForm").addEventListener("submit", async e => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitRecruitBtn");
      submitBtn.disabled = true;
      try {
        const editIdRaw = document.getElementById("recruitEditId").value;
        const title = document.getElementById("recruitTitle").value.trim();
        const host = document.getElementById("recruitHost").value.trim();
        const max = Number(document.getElementById("recruitMax").value) || 4;
        const note = document.getElementById("recruitNote").value.trim();

        if (editIdRaw) {
          const editId = Number(editIdRaw);
          const target = recruits.find(r => Number(r.id) === editId);
          if (target) {
            const currentApplicants = getTotalRecruitApplicants(target);
            if (max < currentApplicants) {
              alert(`현재 신청 인원(${currentApplicants}명)보다 적은 정원으로는 수정할 수 없습니다.`);
              return;
            }
            target.title = title;
            target.host = host;
            target.max = max;
            target.note = note;
            saveLocal(KEYS.recruits, recruits);
            toggleModal("recruitModal", false);
            render();

            await apiPost({ action: "editRecruit", recruit: target });
            setTimeout(syncFromSheet, 900);
          }
        } else {
          const newRecruit = {
            id: Date.now(),
            title,
            host,
            max,
            slots: createEmptySlots(),
            note
          };
          recruits.push(newRecruit);
          saveLocal(KEYS.recruits, recruits);
          e.target.reset();
          toggleModal("recruitModal", false);
          render();

          await apiPost({ action: "addRecruit", recruit: newRecruit });
          setTimeout(syncFromSheet, 900);
        }
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("openSettingsBtn").onclick = () => {
      selectedTheme = config.theme || "blue";
      document.getElementById("cfgBadge").value = config.badge || "L";
      document.getElementById("cfgName").value = config.name || "";
      document.getElementById("cfgSub").value = config.sub || "";
      document.getElementById("cfgHeroTitle").value = config.heroTitle || "";
      document.getElementById("cfgHeroDesc").value = config.heroDesc || "";
      document.querySelectorAll("#swatchGroup .swatch-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.theme === selectedTheme);
      });
      toggleModal("settingsModal", true);
    };
    document.getElementById("closeSettingsBtn").onclick = () => toggleModal("settingsModal", false);
    document.getElementById("cancelSettingsBtn").onclick = () => toggleModal("settingsModal", false);

    document.querySelectorAll("#swatchGroup .swatch-btn").forEach(btn => {
      btn.onclick = () => {
        selectedTheme = btn.dataset.theme;
        document.querySelectorAll("#swatchGroup .swatch-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };
    });

    document.getElementById("resetSettingsBtn").onclick = () => {
      config = structuredClone(defaultConfig);
      saveLocal(KEYS.config, config);
      applyConfig();
      toggleModal("settingsModal", false);
    };

    document.getElementById("settingsForm").addEventListener("submit", e => {
      e.preventDefault();
      config = {
        badge: document.getElementById("cfgBadge").value.trim() || "L",
        name: document.getElementById("cfgName").value.trim() || defaultConfig.name,
        sub: document.getElementById("cfgSub").value.trim() || defaultConfig.sub,
        heroTitle: document.getElementById("cfgHeroTitle").value.trim() || defaultConfig.heroTitle,
        heroDesc: document.getElementById("cfgHeroDesc").value.trim() || defaultConfig.heroDesc,
        theme: selectedTheme
      };
      saveLocal(KEYS.config, config);
      applyConfig();
      toggleModal("settingsModal", false);
    });

    applyConfig();
    render();
    syncFromSheet();
  </script>
</body>
</html>
